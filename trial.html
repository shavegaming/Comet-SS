<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comet SS - Free Trial</title>
    <style>
        :root {
            --bg-dark: #050505;
            --container-bg: #0d0e12;
            --inner-card: #14151a;
            --text-main: #ffffff;
            --text-muted: #777777;
            --price-red: #d9534f;
            --accent-purple: #7d5fff;
            --input-bg: #0a0b0e;
            --border-color: #22242b;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 90%;
            max-width: 1000px;
            background: var(--container-bg);
            padding: 45px;
            border-radius: 4px;
            display: flex;
            gap: 50px;
        }

        /* Branding Image */
        .product-image-container {
            flex: 0 0 320px;
        }

        .product-image-container img {
            width: 100%;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Content */
        .product-details {
            flex: 1;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 8px 0;
            font-weight: 500;
        }

        .price {
            color: var(--price-red);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stock {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .description {
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Clean Form */
        .purchase-card {
            background: var(--inner-card);
            padding: 30px;
            border-radius: 4px;
            border: 1px solid #1c1e26;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #888;
        }

        label span {
            color: var(--price-red);
            margin-left: 4px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--accent-purple);
        }

        .submit-btn {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .main-wrapper { flex-direction: column; padding: 20px; }
            .product-image-container { flex: 0 0 auto; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="product-image-container">
            <img src="https://cdn.discordapp.com/attachments/1451330046651531327/1472759399125880944/IMG_0759.gif?ex=699f9b13&is=699e4993&hm=410cd1149d5e7b73ce2afc7dd1d9db2411059c9d9e44705fb4a8f2cc3fe7d65e&" alt="Comet SS Branding">
        </div>

        <div class="product-details">
            <h1>Comet SS Access Key</h1>
            <div class="price">FREE TRIAL</div>
            <div class="stock">Limited Slots Available</div>

            <p class="description">
                Comet SS is a professional Roblox Server Side Executor. Get temporary access to our script hub and server-side environment to test our features before committing to a full license.
            </p>

            <div class="purchase-card">
                <form action="#" method="POST">
                    <div class="form-group">
                        <label>Discord Username <span>Required</span></label>
                        <input type="text" name="discord_user" placeholder="e.g. comet_user" required>
                    </div>

                    <div class="form-group">
                        <label>Roblox Username <span>Required</span></label>
                        <input type="text" name="roblox_user" placeholder="Enter your username" required>
                    </div>

                    <button type="submit" class="submit-btn">Get Free Trial</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
