<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comet SS - Free Trial</title>

<style>
:root {
    --bg-main: #0b0d14;
    --bg-card: #11131c;
    --bg-inner: #161927;
    --border: #1f2230;
    --accent: #8b5cf6;
    --accent-glow: rgba(139,92,246,0.35);
    --text-main: #ffffff;
    --text-muted: #9ca3af;
    --danger: #ef4444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #141826 0%, #0b0d14 60%);
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.wrapper {
    width: 95%;
    max-width: 1100px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    gap: 50px;
    padding: 50px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
}

/* Left Image */
.product-image {
    flex: 0 0 320px;
}

.product-image img {
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
}

/* Right Content */
.details {
    flex: 1;
}

h1 {
    font-size: 28px;
    margin: 0 0 10px 0;
}

.price {
    color: var(--accent);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
}

.stock {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 25px;
}

.description {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 35px;
}

/* Purchase Card */
.purchase-card {
    background: var(--bg-inner);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
}

input {
    width: 100%;
    background: #0f111a;
    border: 1px solid var(--border);
    padding: 13px;
    border-radius: 6px;
    color: white;
    outline: none;
    transition: 0.2s ease;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
}

.submit-btn {
    width: 100%;
    background: linear-gradient(90deg, #7c3aed, #8b5cf6);
    border: none;
    padding: 14px;
    border-radius: 40px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    transition: 0.25s ease;
}

.submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-glow);
}

#formStatus {
    margin-top: 15px;
    font-size: 13px;
    text-align: center;
}

@media (max-width: 850px) {
    .wrapper {
        flex-direction: column;
        padding: 30px;
    }
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="product-image">
        <img src="https://cdn.discordapp.com/attachments/1451330046651531327/1472759399125880944/IMG_0759.gif" alt="Comet SS">
    </div>

    <div class="details">
        <h1>Comet SS Access Key</h1>
        <div class="price">FREE TRIAL</div>
        <div class="stock">Limited Trial Slots Available</div>

        <p class="description">
            Get temporary access to Comet SS and experience our full script hub and
            server-side environment before purchasing a full license.
        </p>

        <div class="purchase-card">
            <form id="trialForm">
                <div class="form-group">
                    <label>Discord Username</label>
                    <input type="text" name="discord_user" placeholder="username#0001" required>
                </div>

                <div class="form-group">
                    <label>Roblox Username</label>
                    <input type="text" name="roblox_user" placeholder="Enter your username" required>
                </div>

                <button type="submit" class="submit-btn">Request Free Trial</button>
                <p id="formStatus"></p>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById("trialForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const status = document.getElementById("formStatus");
    status.textContent = "Submitting...";
    status.style.color = "#9ca3af";

    const formData = new FormData(this);
    const discordUser = formData.get("discord_user").trim();
    const robloxUser = formData.get("roblox_user").trim();

    if (!discordUser || !robloxUser) {
        status.textContent = "❌ Please fill out all fields.";
        status.style.color = "#ef4444";
        return;
    }

    try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbxTb88bkBTn9Pyu4kBkIb-uu1jH0U5KTxhKGsCzuzh9ZSt5iWW-mrNdEzKcJAZ1ljDLqg/exec", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                discordid: discordUser,
                robloxusername: robloxUser
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            status.textContent = "✅ Trial activated! Check Discord for your Verified role.";
            status.style.color = "#8b5cf6";
            this.reset();
        } else {
            status.textContent = data.error || "❌ Something went wrong. Try again.";
            status.style.color = "#ef4444";
        }
    } catch (err) {
        console.error(err);
        status.textContent = "❌ Network error. Try again.";
        status.style.color = "#ef4444";
    }
});
</script>

</body>
</html>
